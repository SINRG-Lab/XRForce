<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .letter { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 700 12px Arial, Helvetica, sans-serif; fill: #475569; letter-spacing: .35px; }
      .caption { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; }
      .leader { fill: none; stroke: #1f2937; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .outline { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .mesh { fill: none; stroke: #9aa5b5; stroke-width: 1.5; stroke-linecap: round; }
      .cyan { fill: none; stroke: #089fbd; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #6b7280; stroke-width: 9; stroke-linecap: round; }
    </style>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="photoA"><rect x="238" y="116" width="344" height="480" rx="14"/></clipPath>
    <clipPath id="photoPalm"><rect x="570" y="142" width="250" height="155" rx="12"/></clipPath>
    <clipPath id="photoCtl"><rect x="570" y="342" width="250" height="160" rx="12"/></clipPath>
    <clipPath id="photoUse"><path d="M58 754 Q58 724 88 724 H432 Q462 724 462 754 V1000 Q462 1030 432 1030 H88 Q58 1030 58 1000 Z"/></clipPath>
    <clipPath id="capInset"><rect x="935" y="145" width="195" height="126" rx="12"/></clipPath>
    <clipPath id="ctlInset"><rect x="1154" y="167" width="198" height="126" rx="12"/></clipPath>
    <marker id="arrowGray" markerWidth="24" markerHeight="24" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowCyan" markerWidth="24" markerHeight="24" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#089fbd"/>
    </marker>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>

  <!-- Reference-style spotlight connecting the physical system to the sensing inset -->
  <path d="M555 164 L925 68 L925 543 L555 485 Z" fill="#d1d5db" opacity="0.78"/>

  <!-- a: actual wearable -->
  <text class="letter" x="48" y="65">a</text>
  <text class="title" x="105" y="66">XRForce wearable</text>

  <rect x="228" y="106" width="364" height="500" rx="20" fill="#fff" filter="url(#shadow)"/>
  <image x="238" y="116" width="344" height="480" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoA)"
         xlink:href="HardwareReferences/xrforce-worn-dorsal-view.png"/>
  <rect x="238" y="116" width="344" height="480" rx="14" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <text class="label" x="62" y="205">Wrist-mounted</text>
  <text class="label" x="62" y="226">controller</text>
  <path class="leader" d="M182 215 H250 L329 184"/>
  <circle cx="329" cy="184" r="4" fill="#111827"/>

  <text class="label" x="62" y="352">Dorsal wire</text>
  <text class="label" x="62" y="373">routing</text>
  <path class="leader" d="M167 362 H257 L352 350"/>
  <circle cx="352" cy="350" r="4" fill="#111827"/>

  <text class="label" x="62" y="499">Silicone</text>
  <text class="label" x="62" y="520">fingertip cap</text>
  <path class="leader" d="M170 509 H265 L373 523"/>
  <circle cx="373" cy="523" r="4" fill="#111827"/>

  <rect x="560" y="132" width="270" height="175" rx="17" fill="#fff" filter="url(#shadow)"/>
  <image x="570" y="142" width="250" height="155" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoPalm)"
