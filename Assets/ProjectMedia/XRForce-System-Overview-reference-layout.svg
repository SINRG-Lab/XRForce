    <circle cx="31" cy="76" r="5" fill="#089fbd"/>
    <text class="small" x="31" y="103" text-anchor="middle">UDP</text>
  </g>

  <g transform="translate(982 358)">
    <text class="label" x="88" y="0" text-anchor="middle">Contact pressure</text>
    <path d="M55 18 V50 M88 18 V50 M121 18 V50" stroke="#111827" stroke-width="4" marker-end="url(#arrowGray)"/>
    <rect x="40" y="62" width="96" height="96" fill="#fff" stroke="#374151" stroke-width="2"/>
    <rect x="44" y="66" width="28" height="28" fill="#d7f4f8"/><rect x="74" y="66" width="28" height="28" fill="#78d4e2"/><rect x="104" y="66" width="28" height="28" fill="#d7f4f8"/>
    <rect x="44" y="96" width="28" height="28" fill="#78d4e2"/><rect x="74" y="96" width="28" height="28" fill="#089fbd"/><rect x="104" y="96" width="28" height="28" fill="#78d4e2"/>
    <rect x="44" y="126" width="28" height="28" fill="#d7f4f8"/><rect x="74" y="126" width="28" height="28" fill="#78d4e2"/><rect x="104" y="126" width="28" height="28" fill="#d7f4f8"/>
  </g>

  <path class="outline" d="M1145 463 H1201" marker-end="url(#arrowGray)"/>
  <g transform="translate(1222 364)">
    <text class="label" x="92" y="0" text-anchor="middle">Virtual force</text>
    <ellipse cx="92" cy="148" rx="71" ry="19" fill="#cdf4f8" stroke="#089fbd" stroke-width="2"/>
    <path class="outline" d="M49 35 L70 130 M135 35 L114 130"/>
    <path class="cyan" d="M33 90 H69" marker-end="url(#arrowCyan)"/>
    <path class="cyan" d="M151 90 H115" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- c: lower interaction loop, following the reference's visual grammar -->
  <text class="letter" x="48" y="693">c</text>

  <rect x="48" y="714" width="424" height="326" rx="18" fill="#fff" filter="url(#shadow)"/>
  <image x="58" y="724" width="404" height="306" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoUse)"
