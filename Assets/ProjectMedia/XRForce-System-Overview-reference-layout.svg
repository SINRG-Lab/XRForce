  <path d="M1547 832 L1322 873" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <path d="M1547 895 L1322 891" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1322" cy="873" r="7" fill="#089fbd"/>
  <circle cx="1322" cy="891" r="7" fill="#089fbd"/>

  <!-- mesh lines -->
  <path class="mesh" d="M1684 806 C1610 821 1553 842 1510 868"/>
  <path class="mesh" d="M1701 842 C1623 850 1564 868 1518 891"/>
  <path class="mesh" d="M1703 881 C1622 883 1562 894 1515 913"/>
  <path class="mesh" d="M1694 923 C1612 918 1554 926 1508 938"/>
