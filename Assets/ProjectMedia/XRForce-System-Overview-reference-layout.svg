  <rect x="570" y="342" width="250" height="160" rx="12" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="580" y="351" width="142" height="25" rx="12" fill="#fff" opacity="0.94"/>
  <text class="tiny" x="594" y="368">CONTROL UNIT</text>

  <line x1="405" y1="626" x2="498" y2="626" stroke="#111827" stroke-width="9"/>
  <text class="label" x="451" y="615" text-anchor="middle">20 mm</text>

  <!-- b: circular sensor and rendering inset -->
  <text class="letter" x="872" y="65">b</text>
  <circle cx="1214" cy="301" r="286" fill="#fff" stroke="#374151" stroke-width="2.5"/>
  <text class="title" x="1214" y="78" text-anchor="middle">Pressure-to-force pipeline</text>

  <rect x="925" y="135" width="215" height="146" rx="17" fill="#fff" filter="url(#shadow)"/>
  <image x="935" y="145" width="195" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#capInset)"
         xlink:href="HardwareReferences/xrforce-silicone-cap-palmar-view.png"/>
  <rect x="935" y="145" width="195" height="126" rx="12" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text class="small" x="1032" y="301" text-anchor="middle">Inner fingertip sensor</text>

  <path d="M1142 204 C1158 178 1173 178 1189 204" fill="none" stroke="#ef4444" stroke-width="4"/>
  <path d="M1142 216 C1158 190 1173 190 1189 216" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <path d="M1142 228 C1158 202 1173 202 1189 228" fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M1142 240 C1158 214 1173 214 1189 240" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text class="tiny" x="1166" y="264" text-anchor="middle">WIRED</text>

  <rect x="1144" y="157" width="218" height="146" rx="17" fill="#fff" filter="url(#shadow)"/>
  <image x="1154" y="167" width="198" height="126" preserveAspectRatio="xMidYMid slice" clip-path="url(#ctlInset)"
