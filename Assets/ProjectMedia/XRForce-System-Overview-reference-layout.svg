  <rect x="570" y="142" width="250" height="155" rx="12" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="580" y="151" width="126" height="25" rx="12" fill="#fff" opacity="0.94"/>
  <text class="tiny" x="594" y="168">INNER SENSOR</text>

  <rect x="560" y="332" width="270" height="180" rx="17" fill="#fff" filter="url(#shadow)"/>
  <image x="570" y="342" width="250" height="160" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoCtl)"
