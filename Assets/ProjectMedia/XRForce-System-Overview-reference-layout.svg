  <rect x="58" y="724" width="404" height="306" rx="14" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <g transform="translate(83 738)">
    <rect x="0" y="0" width="96" height="60" rx="22" fill="#fff" stroke="#374151" stroke-width="3"/>
    <circle cx="32" cy="30" r="8" fill="#089fbd"/><circle cx="64" cy="30" r="8" fill="#089fbd"/>
    <path class="outline" d="M-18 18 H0 M96 18 H114"/>
