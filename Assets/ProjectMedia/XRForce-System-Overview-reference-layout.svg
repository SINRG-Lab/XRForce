  <rect x="1154" y="167" width="198" height="126" rx="12" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <text class="small" x="1253" y="323" text-anchor="middle">Wrist controller</text>

  <path class="outline" d="M1376 223 H1406" marker-end="url(#arrowGray)"/>
