  <path class="arrow" d="M668 776 C752 713 856 716 927 790" marker-end="url(#arrowGray)"/>
  <path class="arrow" d="M991 846 C1020 925 969 1001 877 1020" marker-end="url(#arrowGray)"/>
  <path class="arrow" d="M790 1022 C700 1011 645 950 652 864" marker-end="url(#arrowGray)"/>

  <g transform="translate(552 724)">
    <circle cx="92" cy="92" r="88" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <path class="outline" d="M63 40 L74 118 M121 40 L110 118"/>
    <ellipse cx="92" cy="128" rx="38" ry="11" fill="#cdf4f8" stroke="#089fbd" stroke-width="2"/>
    <text class="label" x="92" y="161" text-anchor="middle">Precision grasp</text>
  </g>

  <g transform="translate(895 754)">
    <circle cx="92" cy="92" r="88" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <ellipse cx="92" cy="116" rx="42" ry="12" fill="#cdf4f8" stroke="#089fbd" stroke-width="2"/>
    <path class="cyan" d="M51 77 Q91 38 132 77" marker-end="url(#arrowCyan)"/>
    <text class="label" x="92" y="161" text-anchor="middle">Wafer transfer</text>
  </g>

  <g transform="translate(730 916)">
    <circle cx="92" cy="92" r="78" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <path class="outline" d="M50 117 V63 M50 117 H133"/>
    <rect x="64" y="91" width="12" height="26" fill="#cbd5e1" stroke="#374151"/>
    <rect x="85" y="77" width="12" height="40" fill="#7cd6e4" stroke="#089fbd"/>
    <rect x="106" y="55" width="12" height="62" fill="#cbd5e1" stroke="#374151"/>
    <path class="cyan" d="M60 83 L82 68 L101 74 L127 45"/>
    <text class="label" x="92" y="151" text-anchor="middle">Force feedback</text>
  </g>

  <!-- large curved arrow toward the virtual hand -->
  <path d="M1039 770 C1130 692 1227 700 1315 770" fill="none" stroke="#6b7280" stroke-width="13" marker-end="url(#arrowGray)"/>

  <!-- cyan wafer and deterministic wireframe hand -->
  <ellipse cx="1281" cy="886" rx="96" ry="31" fill="#74d6e6" opacity="0.88" stroke="#089fbd" stroke-width="3"/>
  <path d="M1698 785 C1624 736 1540 740 1488 783 C1449 816 1436 843 1397 850 C1359 857 1336 865 1312 877" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M1712 974 C1612 1005 1521 986 1464 945 C1428 919 1397 903 1360 897 C1340 894 1323 891 1310 887" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M1698 785 C1733 833 1733 919 1712 974" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- index and thumb contours -->
  <path d="M1638 774 C1582 758 1518 775 1474 810 C1444 834 1414 842 1373 849" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M1660 813 C1600 795 1541 810 1498 841 C1463 866 1429 871 1387 876" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M1661 950 C1591 966 1536 947 1490 918 C1454 895 1417 889 1382 888" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M1644 912 C1580 927 1533 912 1498 890 C1462 868 1428 870 1390 878" fill="none" stroke="#64748b" stroke-width="3"/>

